blueprint:
  name: Remote control IKEA Bilresa dual button
  description: |
      Controls lights with the two buttons of an IKEA Bilresa Matter dual button remote: press to switch, hold to dim.
      Works in two modes: both buttons on a shared group of lights, or one light per button.

      **Version:** 2026-11-01

      Changelog entries marked ⚠️ may break automations that already use this blueprint. Check them before updating.

      <details>
      <summary>How it works</summary>

      The remote has two momentary buttons and no scroll wheel. The blueprint listens to the button events of the remote (single press, double press, hold, release) and translates them into light commands. Pick the behaviour with the **Operating mode** input.

      Choose the **operating mode** below:

      - **Shared lights** (default): both buttons control the same group of lights.
      - **One light per button**: button 1 controls light 1 and button 2 controls light 2, each with its own toggle and dimming.

      #### Shared lights

      | Gesture | Button 1 (on / brighter) | Button 2 (off / dimmer) |
      |---|---|---|
      | Single press | turn on | turn off |
      | Double press | full brightness | minimum brightness (night light) |
      | Hold | brighter until released | dimmer until released (never turns the light off) |

      Holding a button first turns lights that are off on at the minimum brightness (button 1), or leaves them off (button 2).

      #### One light per button

      | Gesture | Result |
      |---|---|
      | Single press | toggle the light on / off |
      | Double press | full brightness (optional, on by default) |
      | Hold | the first hold dims **up**, the next hold dims **down**, and so on, until the button is released |

      A light that is off is turned on at the minimum brightness when you hold its button (and dims up). Dimming down never turns the light off.
      The direction is remembered in an optional `input_boolean` per button (see *Hold direction helpers*). Without helpers the direction is derived from the brightness: up, unless the light is already at 100 %.
      The double press can be switched off with *Double press = full brightness*.

      #### Hold-to-dim safety

      Hold-to-dim stops when the button is released (`long_release`), when the remote's `current_switch_position` sensor of that button returns to `0` (only if you enabled it, see below), or after the maximum hold time, so a missed release can never leave a light dimming forever.

      </details>

      <details>
      <summary>❗Optional setup: enable the 2 hidden sensors (extra safety for hold-to-dim)</summary>

      The remote has two sensors that are **disabled by default**: `sensor.<device_name>_current_switch_position_1` and `_2`.
      They are not required. When enabled, they stop a hold-to-dim as soon as the button is released, even if the release event of the remote is lost.

      1. Go to **Settings → Devices & services → Matter** and open your Bilresa device.
      2. Click **+N entities not shown** to reveal the disabled entities.
      3. Open each `current switch position` sensor, click the cog and enable it.

      </details>

      <details>
      <summary>Changelog</summary>

      - **2026-11-01**: new option *Double press = full brightness* for the *One light per button* mode (default on).
      - **2026-11-01**: added a short summary and a collapsible *How it works* section to the description.
      - **2026-11-01**: new *Operating mode* input: besides the shared mode (unchanged, default) each button can control its own light (single press toggles, hold alternates between dimming up and down). New optional inputs: *Light for button 1/2* and *Hold direction helpers*. Existing automations keep working without changes.
      - **2026-10-31**: first version.

      </details>
  domain: automation
  source_url: https://github.com/qnimbus/homeassistant/blob/main/blueprints/automation/qnimbus/remote_control_ikea_bilresa_dual_button.yaml

  input:
    remote:
      name: Remote
      description: "IKEA Bilresa dual button remote control"
      selector:
        device:
          filter:
            manufacturer: IKEA of Sweden
            model: BILRESA dual button
            integration: matter
    operating_mode:
      name: Operating mode
      description: |
        **Shared lights**: both buttons control the lights selected under *Lights*.
        **One light per button**: button 1 controls *Light for button 1*, button 2 controls *Light for button 2*.
      default: shared
      selector:
        select:
          mode: list
          options:
            - label: Shared lights (button 1 on / brighter, button 2 off / dimmer)
              value: shared
            - label: One light per button (press toggles, hold dims up / down)
              value: separate
    lights:
      name: Lights (shared mode)
      description: "Lights controlled by both buttons. Only used in the *Shared lights* mode"
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light

    light_button_1:
      name: Light for button 1 (one light per button mode)
      description: "Only used in the *One light per button* mode"
      default: ""
      selector:
        entity:
          filter:
            domain: light
    light_button_2:
      name: Light for button 2 (one light per button mode)
      description: "Only used in the *One light per button* mode"
      default: ""
      selector:
        entity:
          filter:
            domain: light

    double_press_full:
      name: Double press = full brightness (one light per button mode)
      description: "Only used in the *One light per button* mode. A double press sets the button's light to 100 %"
      default: true
      selector:
        boolean:

    direction_section:
      name: Hold direction helpers (one light per button mode)
      description: |
        Optional. Create an `input_boolean` helper per button (Settings → Devices & services → Helpers → Toggle).
        The blueprint uses it to remember whether the next hold dims up (on) or down (off), and flips it on every hold.
        Without a helper the direction follows the brightness: up, unless the light is already at 100 %.
      collapsed: true
      input:
        direction_helper_1:
          name: Direction helper for button 1
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        direction_helper_2:
          name: Direction helper for button 2
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean

    dimming_section:
      name: Dimming settings
      collapsed: true
      input:
        dim_step_pct:
          name: Dim step percentage
          description: "Brightness change in % per step while holding a button"
          default: 10
          selector:
            number:
              min: 1
              max: 50
              step: 1
              mode: box
        dim_min_pct:
          name: Minimum brightness percentage
          description: |
            Dimming down never goes below this value, a double press on button 2 (shared mode) sets it,
            and holding a button on a light that is off starts here
          default: 5
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: box
        hold_interval:
          name: Hold interval
          description: "Seconds between two dim steps while a button is held"
          default: 0.3
          selector:
            number:
              min: 0.1
              max: 2
              step: 0.1
              unit_of_measurement: s
              mode: box
        hold_max_seconds:
          name: Maximum hold time
          description: "Safety limit: hold-to-dim always stops after this many seconds"
          default: 10
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: s
              mode: box
        light_transition:
          name: Light transition
          description: "Transition time in seconds for every light command"
          default: 0.3
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: box

# automation logic
trigger:
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_1 }}"
    id: button_1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_2 }}"
    id: button_2

condition:
  # ignore availability changes and brand new entities
  - condition: template
    value_template: >-
      {{ trigger.event.data.old_state is not none
         and trigger.event.data.new_state is not none
         and trigger.event.data.old_state.state != 'unavailable'
         and trigger.event.data.new_state.state != 'unavailable'
      }}

action:
  - variables:
      event_type: "{{ trigger.event.data.new_state.attributes.event_type | default('') }}"
      # position sensor of the button that triggered (may be empty/disabled)
      pos_sensor: "{{ var_pos_1 if trigger.id == 'button_1' else var_pos_2 }}"
      hold_started: "{{ as_timestamp(now()) }}"
      # one light per button mode: the light and direction helper of the button that triggered
      single_light: "{{ var_light_1 if trigger.id == 'button_1' else var_light_2 }}"
      dir_helper: "{{ var_helper_1 if trigger.id == 'button_1' else var_helper_2 }}"
  - choose:
      # ---- button 1: on / brighter
      - conditions: "{{ var_mode == 'shared' and trigger.id == 'button_1' and event_type == 'multi_press_1' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lights
            data:
              transition: "{{ var_transition }}"
      - conditions: "{{ var_mode == 'shared' and trigger.id == 'button_1' and event_type == 'multi_press_2' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lights
            data:
              brightness_pct: 100
              transition: "{{ var_transition }}"
      - conditions: "{{ var_mode == 'shared' and trigger.id == 'button_1' and event_type == 'long_press' }}"
        sequence:
          # lights that are off start at the minimum brightness
          - repeat:
              for_each: !input lights
              sequence:
                - if: "{{ is_state(repeat.item, 'off') }}"
                  then:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        brightness_pct: "{{ var_min_pct }}"
                        transition: "{{ var_transition }}"
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ state_attr(trigger.event.data.entity_id, 'event_type') == 'long_press'
                       and not is_state(pos_sensor, '0')
                       and as_timestamp(now()) - hold_started < var_hold_max_seconds }}
              sequence:
                - variables:
                    on_lights: "{{ var_lights | select('is_state', 'on') | list }}"
                - if: "{{ on_lights | length > 0 }}"
                  then:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ on_lights }}"
                      data:
                        brightness_step_pct: "{{ var_step_pct }}"
                        transition: "{{ var_transition }}"
                - delay:
                    seconds: "{{ var_hold_interval }}"

      # ---- button 2: off / dimmer
      - conditions: "{{ var_mode == 'shared' and trigger.id == 'button_2' and event_type == 'multi_press_1' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input lights
            data:
              transition: "{{ var_transition }}"
      - conditions: "{{ var_mode == 'shared' and trigger.id == 'button_2' and event_type == 'multi_press_2' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lights
            data:
              brightness_pct: "{{ var_min_pct }}"
              transition: "{{ var_transition }}"
      - conditions: "{{ var_mode == 'shared' and trigger.id == 'button_2' and event_type == 'long_press' }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ state_attr(trigger.event.data.entity_id, 'event_type') == 'long_press'
                       and not is_state(pos_sensor, '0')
                       and as_timestamp(now()) - hold_started < var_hold_max_seconds }}
              sequence:
                - repeat:
                    for_each: !input lights
                    sequence:
                      # the step is clamped to the distance above the minimum brightness (0 at or below it),
                      # so holding never turns a light off. brightness attribute is 0..255, unknown counts as 0
                      - variables:
                          current_pct: "{{ (state_attr(repeat.item, 'brightness') | float(0)) * 100 / 255 }}"
                          step_pct: "{{ [var_step_pct, [current_pct - var_min_pct, 0] | max] | min }}"
                      - if: "{{ is_state(repeat.item, 'on') and step_pct > 0 }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              brightness_step_pct: "{{ -1 * step_pct }}"
                              transition: "{{ var_transition }}"
                - delay:
                    seconds: "{{ var_hold_interval }}"

      # ---- one light per button: single press toggles
      - conditions: "{{ var_mode == 'separate' and single_light != '' and event_type == 'multi_press_1' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ single_light }}"
            data:
              transition: "{{ var_transition }}"

      # ---- one light per button: double press = full brightness
      - conditions: "{{ var_mode == 'separate' and var_double_full and single_light != '' and event_type == 'multi_press_2' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ single_light }}"
            data:
              brightness_pct: 100
              transition: "{{ var_transition }}"

      # ---- one light per button: hold dims up, the next hold dims down
      - conditions: "{{ var_mode == 'separate' and single_light != '' and event_type == 'long_press' }}"
        sequence:
          - variables:
              was_off: "{{ is_state(single_light, 'off') }}"
              start_pct: "{{ (state_attr(single_light, 'brightness') | float(0)) * 100 / 255 }}"
              # off: always up. Otherwise the helper decides (on = up); without helper: up unless already at 100 %
              dim_up: >-
                {{ was_off or (is_state(dir_helper, 'on') if dir_helper != '' else start_pct < 100) }}
          # the next hold goes the other way
          - if: "{{ dir_helper != '' }}"
            then:
              - action: "input_boolean.turn_{{ 'off' if dim_up else 'on' }}"
                target:
                  entity_id: "{{ dir_helper }}"
          - if: "{{ was_off }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: "{{ single_light }}"
                data:
                  brightness_pct: "{{ var_min_pct }}"
                  transition: "{{ var_transition }}"
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ state_attr(trigger.event.data.entity_id, 'event_type') == 'long_press'
                       and not is_state(pos_sensor, '0')
                       and as_timestamp(now()) - hold_started < var_hold_max_seconds }}
              sequence:
                # dimming down is clamped to the distance above the minimum brightness, so holding never turns the light off
                - variables:
                    current_pct: "{{ (state_attr(single_light, 'brightness') | float(0)) * 100 / 255 }}"
                    step_pct: >-
                      {{ var_step_pct if dim_up
                         else -1 * ([var_step_pct, [current_pct - var_min_pct, 0] | max] | min) }}
                - if: "{{ is_state(single_light, 'on') and step_pct != 0 }}"
                  then:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ single_light }}"
                      data:
                        brightness_step_pct: "{{ step_pct }}"
                        transition: "{{ var_transition }}"
                - delay:
                    seconds: "{{ var_hold_interval }}"

# restart: a new gesture (including the release of a hold, or the other button) stops a running hold-to-dim at once
mode: restart

variables:
  var_mode: !input operating_mode
  var_lights: !input lights
  var_double_full: !input double_press_full
  var_light_1: !input light_button_1
  var_light_2: !input light_button_2
  var_helper_1: !input direction_helper_1
  var_helper_2: !input direction_helper_2
  var_step_pct: !input dim_step_pct
  var_min_pct: !input dim_min_pct
  var_hold_interval: !input hold_interval
  var_hold_max_seconds: !input hold_max_seconds
  var_transition: !input light_transition

trigger_variables:
  var_remote: !input remote

  # entity ids of the remote, found from the device only: the button number is the last part of the entity id
  # (optionally followed by the _<number> suffix HA adds for duplicate ids); empty when not found
  var_button_1: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_1(?:_\d+)?$') | first | default('') }}
  var_button_2: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_2(?:_\d+)?$') | first | default('') }}
  var_pos_1: >-
    {{ device_entities(var_remote) | select('match', '^sensor\..+[a-zA-Z]_1(?:_\d+)?$') | first | default('') }}
  var_pos_2: >-
    {{ device_entities(var_remote) | select('match', '^sensor\..+[a-zA-Z]_2(?:_\d+)?$') | first | default('') }}
