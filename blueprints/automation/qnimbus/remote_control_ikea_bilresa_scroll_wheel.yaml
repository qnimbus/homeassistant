blueprint:
  name: Remote control IKEA Bilresa scroll wheel
  description: |
      Blueprint for Ikea Bilresa Matter (button and scroll wheel for 3 different channels)

      **Version:** 2026-10-30

      Changelog entries marked ⚠️ may break automations that already use this blueprint. Check them before updating.

      <details>
      <summary>❗Setup: enable the 9 hidden sensors (needed for <code>instant</code> scroll wheel mode)</summary>

      The remote has nine sensors that are **disabled by default**:

      `sensor.<device_name>_current_switch_position_1` … `_9`

      Example: `sensor.bilresa_scroll_wheel_current_switch_position_1`

      **How to enable them**

      1. Go to **Settings → Devices & services → Matter** and open your Bilresa device.
      2. Click **+N entities not shown** to reveal the disabled entities.
      3. Open each `current switch position` sensor, click the cog and enable it.
      4. Reload the Matter integration if the sensors don't show up.

      **What happens without them**

      - Scroll wheel in `instant` mode: the blueprint falls back to `relaxed` mode for that channel (one action after scrolling instead of one per click).
      - Scroll wheel in `relaxed` mode and all button actions: work without them.

      </details>

      **Credits:** based on the blueprint by [jhol-byte](https://gist.github.com/jhol-byte/b2731a4d2476f530d76b9ff409f7f3a4) (version 2026-04-06). Original discussion: [Home Assistant community](https://community.home-assistant.io/t/ikea-bilresa-scroll-wheel-blueprint-matter/965365)

      <details>
      <summary>Changelog</summary>

      - **2026-10-30**: cleanup without functional changes: the 15 entity lookups of the remote are now one-line templates instead of 7-line loops (they return the first match or an empty value), the unused top-level `alias` is removed and the channel 1 evaluation mode description is formatted like channels 2 and 3.
      - **2026-10-30**: the color temperature and color hue scroll modes no longer need the helper scripts `script.light_color_temp_helper` and `script.light_color_hs_helper`: their logic is built into the blueprint, so a fresh import works without any extra setup. The behaviour is the same, except that scrolling the hue on a light without a known color (e.g. one that is off) now starts at hue 0 instead of raising a template error; the saturation sent to the light is now kept within 0..100, so a <Color saturation> of 0 no longer produces an invalid value. The scripts are no longer used by this blueprint; you can keep or delete them.
      - **2026-10-30**: ⚠️ **may break existing automations:** the remote's entities are now detected with stricter patterns that must match the end of the entity ID. A device name containing a number (e.g. "Bilresa 1") no longer makes every entity match the same channel, which silently disabled that channel. Entity IDs that end in `_<1-9>` (optionally followed by HA's `_<number>` duplicate suffix, e.g. `button_1_2`) keep working. Entity IDs that you renamed so that text follows the button number (e.g. `..._button_1_left`) are no longer found. Rename them back to end with the button number.
      - **2026-10-30**: scroll wheel targets of the wrong type for the active mode are now skipped: lights only react to the `lights:` modes and media players only to `media: volume control`. Useful for a channel with both lights and media players (e.g. with the `dynamic` mode), where the other type used to receive service calls that only fit one type.
      - **2026-10-30**: fixed the auto reset of `input_select` helpers: channels without a scroll wheel mode `input_select` are now skipped, instead of making the run fail with an empty target (which stopped the button or scroll action that triggered it). Also, a state change without a previous or new state (e.g. a newly created entity) no longer causes an error in the start condition.
      - **2026-10-30**: scroll wheel `instant` mode now falls back to `relaxed` for a channel when the remote's `current_switch_position` sensors are missing or disabled, instead of silently doing nothing. The check only runs for `instant` scroll triggers, not for button clicks.
      - **2026-10-30**: fixed dimming (`lights: dim`): brightness is now converted with 255 instead of 254; scrolling down no longer raises a light that sits below the minimum brightness; a light without a known brightness no longer causes a template error.
      - **2026-10-30**: ⚠️ **may break existing automations:** renamed to "Remote control IKEA Bilresa scroll wheel" (file renamed to `remote_control_ikea_bilresa_scroll_wheel.yaml`; `source_url` and README updated). Automations that were created from the old file `ikea_bilresa_scroll_wheel.yaml` of this repository must be pointed to the new blueprint.
      - **2026-10-30**: added a collapsible setup note with steps for enabling the nine `current_switch_position_1..9` sensors, needed for scroll wheel use in `instant` mode.
      - **2026-10-30**: forked from jhol-byte's 2026-04-06 version; added `source_url` so it can be imported from this repository.

      </details>
  domain: automation
  source_url: https://github.com/qnimbus/homeassistant/blob/main/blueprints/automation/qnimbus/remote_control_ikea_bilresa_scroll_wheel.yaml
  
  # input selectors
  input:
    remote:
      name: Remote
      description: "Ikea Bilresa scroll wheel remote control"
      selector:
        device:
          filter:
            manufacturer: IKEA of Sweden
            model: BILRESA scroll wheel
            integration: matter

    # input selectors: channel 1
    channel1_section:
      name: Channel 1
      collapsed: true
      input:
        click_action_ch1:
          name: "Channel 1: <click> action"
          default: []
          selector:
            action: {}
        double_click_action_ch1:
          name: "Channel 1: <double-click> action"
          default: []
          selector:
            action: {}
        triple_click_action_ch1:
          name: "Channel 1: <triple-click> action"
          default: []
          selector:
            action: {}
        long_click_action_ch1:
          name: "Channel 1: <long-click> action"
          description: ""
          default: []
          selector:
            action: {}
        on_hold_action_ch1:
          name: "Channel 1: <on-hold> action"
          description: "repeat action until button is released, see also on_hold_delay"
          default: []
          selector:
            action: {}
        scroll_wheel_target_ch1:
          name: "Channel 1: Scroll wheel target entity"
          description: |
            Light or media player to be controlled by scroll wheel for channel 1
            - empty for <user defined> scroll wheel mode
          selector:
            entity:
              multiple: true
              filter:
                domain:
                - light
                - media_player
                
          default: []
        scroll_wheel_mode_ch1:
          selector:
            select:
              options:
                - "lights: dim"
                - "lights: color temp and color hue"
                - "lights: color temp only"
                - "lights: color hue only"
                - "media: volume control"
                - "dynamic: choose from input_select"
                - "user defined"
          default: "lights: dim"
          name: "Channel 1: Scroll wheel mode"
          description: "Select attribute of target entity controlled by scroll wheel"
        scroll_wheel_mode_dynamic_ch1:
          selector:
            entity:
              filter:
                domain:
                - input_select
          default:
          name: "Channel 1: Scroll wheel mode input_select"
          description: |-
            For scroll wheel mode <dynamic> only, leave empty otherwise.
            Create and choose an 'input_select' containing the scroll wheel modes you want to choose from dynamically, e.g.
            - "lights: dim"
            - "lights: color temp only"
        scroll_wheel_mode_ext_ch1:
          selector:
            select:
              options:
                - "relaxed"
                - "instant"
          default: "relaxed"
          name: "Channel 1: Scroll wheel evaluation mode"
          description: |
            - <relaxed>: one action call after scrolling
            - <instant>: many action calls while scrolling
            
            Beware:
            - for <instant> mode the 9 hidden sensor entities of Bilresa device have to be enabled (otherwise this channel falls back to <relaxed>)
        scroll_wheel_user_action_ch1:
          name: "Channel 1: User defined scroll wheel action"
          description: |
            For scroll wheel mode <user defined> only
            Exposed variables:
            - <scroll_clicks>: for <instant> mode always 1, for <relaxed> mode number between 1 to 8
            - <scroll_direction>: 'left' or 'right'
          default: []
          selector:
            action: {}

    # input selectors: channel 2
    channel2_section:
      name: Channel 2
      collapsed: true
      input:
        click_action_ch2:
          name: "Channel 2: <click> action"
          default: []
          selector:
            action: {}
        double_click_action_ch2:
          name: "Channel 2: <double-click> action"
          default: []
          selector:
            action: {}
        triple_click_action_ch2:
          name: "Channel 2: <triple-click> action"
          default: []
          selector:
            action: {}
        long_click_action_ch2:
          name: "Channel 2: <long-click> action"
          description: ""
          default: []
          selector:
            action: {}
        on_hold_action_ch2:
          name: "Channel 2: <on-hold> action"
          description: "repeat action until button is released, see also on_hold_delay"
          default: []
          selector:
            action: {}
        scroll_wheel_target_ch2:
          name: "Channel 2: Scroll wheel target entity"
          description: |
