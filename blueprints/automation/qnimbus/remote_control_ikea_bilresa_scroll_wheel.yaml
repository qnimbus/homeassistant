          description: |
            auto reset time for input_select helpers if > 0
            input_selects are reset to first selection
          default: 0
          selector:
            number:
              mode: box
              step: 60
        on_hold_delay:
          name: On hold delay
          description: delay between separate action calls while on hold button
          default: 0.1
          selector:
            number:
              mode: box
              step: 0.1
        max_queued_automation_calls:
          name: Max queued automation calls
          description: |
            Increase if you want to queue more automation calls for special cases
          default: 10
          selector:
            number:
              mode: box
              step: 1
          

# automation logic
trigger:
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_button_ch1 }}"
    trigger: event
    id: button_ch1
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ch1 }}"
    trigger: event
    id: scroll_left_ch1
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ch1 }}"
    trigger: event
    id: scroll_right_ch1
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ext_ch1 }}"
    trigger: event
    id: scroll_left_ext_ch1
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ext_ch1 }}"
    trigger: event
    id: scroll_right_ext_ch1

  - event_type: state_changed
    event_data:
      entity_id: "{{ var_button_ch2 }}"
    trigger: event
    id: button_ch2
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ch2 }}"
    trigger: event
    id: scroll_left_ch2
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ch2 }}"
    trigger: event
    id: scroll_right_ch2
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ext_ch2 }}"
    trigger: event
    id: scroll_left_ext_ch2
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ext_ch2 }}"
    trigger: event
    id: scroll_right_ext_ch2

  - event_type: state_changed
    event_data:
      entity_id: "{{ var_button_ch3 }}"
    trigger: event
    id: button_ch3
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ch3 }}"
    trigger: event
    id: scroll_left_ch3
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ch3 }}"
    trigger: event
    id: scroll_right_ch3
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ext_ch3 }}"
    trigger: event
    id: scroll_left_ext_ch3
  - event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ext_ch3 }}"
    trigger: event
    id: scroll_right_ext_ch3


condition:
  - condition: template
    value_template: >-
      {{ trigger.event.data.old_state is not none
         and trigger.event.data.new_state is not none
         and trigger.event.data.old_state.state != 'unavailable'
         and trigger.event.data.new_state.state != 'unavailable'
      }}
action:
  - variables:
      channel: >-
        {% if trigger.id in ['button_ch1', 'scroll_left_ch1', 'scroll_right_ch1', 'scroll_left_ext_ch1', 'scroll_right_ext_ch1'] %}
          ch1
        {% elif trigger.id in ['button_ch2', 'scroll_left_ch2', 'scroll_right_ch2', 'scroll_left_ext_ch2', 'scroll_right_ext_ch2'] %}
          ch2
        {% elif trigger.id in ['button_ch3', 'scroll_left_ch3', 'scroll_right_ch3', 'scroll_left_ext_ch3', 'scroll_right_ext_ch3'] %}
          ch3
        {% endif %}
      # effective evaluation mode of the channel. Only looked up for <instant> scroll triggers: it needs the hidden
      # current_switch_position sensors, so fall back to <relaxed> when they are missing/disabled (has_value is false)
      scroll_mode_ext: >-
        {% set configured = vars['scroll_wheel_mode_ext_' ~ channel] %}
        {% if configured == 'instant' and trigger.id.startswith('scroll_') %}
          {% set ext = {'ch1': [var_scroll_left_ext_ch1, var_scroll_right_ext_ch1],
                        'ch2': [var_scroll_left_ext_ch2, var_scroll_right_ext_ch2],
                        'ch3': [var_scroll_left_ext_ch3, var_scroll_right_ext_ch3]}[channel] %}
          {{ 'instant' if has_value(ext[0]) and has_value(ext[1]) else 'relaxed' }}
        {% else %}
          {{ configured }}
        {% endif %}
  - if: "{{ var_reset_time_input_select_helpers > 0 and last_triggered_seconds > var_reset_time_input_select_helpers }}"
    then:
      repeat:
        for_each:
          - "ch1"
          - "ch2"
          - "ch3"
        sequence:
          # only channels that have a <Scroll wheel mode input_select> configured
          - if: "{{ ((vars['scroll_wheel_mode_dynamic_' ~ repeat.item] or '') | length) > 0 }}"
            then:
              - action: input_select.select_first
                target:
                  entity_id: "{{ vars['scroll_wheel_mode_dynamic_' ~ repeat.item] }}"
  - choose:
      # button click
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == ('button_' ~ channel) and trigger.event.data.new_state.attributes.event_type ==
              'multi_press_1' }}
        sequence:
          - if: "{{ channel == 'ch1'}}"
            then:
              !input click_action_ch1
          - if: "{{ channel == 'ch2'}}"
            then:
              !input click_action_ch2
          - if: "{{ channel == 'ch3'}}"
            then:
              !input click_action_ch3
      # button double-click
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == ('button_' ~ channel) and trigger.event.data.new_state.attributes.event_type ==
              'multi_press_2' }}
        sequence:
          - if: "{{ channel == 'ch1'}}"
            then:
              !input double_click_action_ch1
          - if: "{{ channel == 'ch2'}}"
            then:
              !input double_click_action_ch2
          - if: "{{ channel == 'ch3'}}"
            then:
              !input double_click_action_ch3
      # button triple-click
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == ('button_' ~ channel) and trigger.event.data.new_state.attributes.event_type ==
              'multi_press_3' }}
        sequence:
          - if: "{{ channel == 'ch1'}}"
            then:
              !input triple_click_action_ch1
          - if: "{{ channel == 'ch2'}}"
            then:
              !input triple_click_action_ch2
          - if: "{{ channel == 'ch3'}}"
            then:
              !input triple_click_action_ch3
      # button long-press
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == ('button_' ~ channel) and trigger.event.data.new_state.attributes.event_type ==
              'long_press' }}
      # button on-hold action
        sequence:
          - if: "{{ channel == 'ch1'}}"
            then:
              sequence:
                - sequence: !input long_click_action_ch1
                - repeat:
                    while: "{{ repeat.index < 100 and state_attr(var_button_ch1, 'event_type') == 'long_press' }}"
                    sequence:
                    - sequence: !input on_hold_action_ch1
                    - delay: "{{ var_on_hold_delay }}"
          - if: "{{ channel == 'ch2'}}"
            then:
              sequence:
                - sequence: !input long_click_action_ch2
                - repeat:
                    while: "{{ repeat.index < 100 and state_attr(var_button_ch2, 'event_type') == 'long_press' }}"
                    sequence:
                    - sequence: !input on_hold_action_ch2
                    - delay: "{{ var_on_hold_delay }}"
          - if: "{{ channel == 'ch3'}}"
            then:
              sequence:
                - sequence: !input long_click_action_ch3
                - repeat:
                    while: "{{ repeat.index < 100 and state_attr(var_button_ch3, 'event_type') == 'long_press' }}"
                    sequence:
                    - sequence: !input on_hold_action_ch3
                    - delay: "{{ var_on_hold_delay }}"
      # scroll wheel actions
      - conditions:
          - condition: template
            value_template: >
              {{ ( (scroll_mode_ext == 'relaxed') and (trigger.id == ('scroll_left_' ~ channel) or trigger.id == ('scroll_right_' ~ channel))) or
                 (  (scroll_mode_ext == 'instant') and (trigger.id == ('scroll_left_ext_' ~ channel) or trigger.id == ('scroll_right_ext_' ~ channel)) and trigger.event.data.new_state.state == '1' )  
              }}
        sequence:
          - variables:
              scroll_clicks: >
                {% if (scroll_mode_ext == 'relaxed') %}
                  {{ trigger.event.data.new_state.attributes.totalNumberOfPressesCounted }}
                {% else %}
                  1
                {% endif %}
              scroll_direction: >
                {% if (trigger.id == 'scroll_left_' ~ channel) or (trigger.id == 'scroll_left_ext_' ~ channel)%}
                  left
                {% else %}
                  right
                {% endif %}
              scroll_wheel_mode: >
                {{ vars['scroll_wheel_mode_' ~ channel] if vars['scroll_wheel_mode_' ~ channel] != 'dynamic: choose from input_select' else states(vars['scroll_wheel_mode_dynamic_' ~ channel]) }}
          - if:
              # scroll wheel mode: <user defined>
              - condition: template
                value_template: "{{ scroll_wheel_mode == 'user defined' }}"
            then:
              sequence:
                - if: "{{ channel == 'ch1'}}"
                  then:
                    !input scroll_wheel_user_action_ch1
                - if: "{{ channel == 'ch2'}}"
                  then:
                    !input scroll_wheel_user_action_ch2
                - if: "{{ channel == 'ch3'}}"
                  then:
                    !input scroll_wheel_user_action_ch3
            else:
            - repeat:
                for_each: "{{ vars['targets_entities_' ~ channel] }}"
                sequence:
                  - choose:
                    - conditions:
                      - condition: template
                        value_template: "{{ repeat.item.startswith('light.') and scroll_wheel_mode == 'lights: dim'}}"
                      sequence:
                        # scroll wheel mode: <lights: dim>
                        - if:
                            - condition: template
                              value_template: >-
                                {{ is_state(repeat.item, 'on') or (var_dim_turns_lights_on and scroll_direction == 'right')
                                }}
                          then:
                            - if:
                                - condition: template
                                  value_template: >-
                                    {{ is_state(repeat.item, 'on') 
                                    }}
                              then:
                                # brightness attribute is 0..255; unknown (None) counts as 0 so that scrolling down is a no-op instead of an error
                                - variables:
                                    current_pct: "{{ (state_attr(repeat.item, 'brightness') | float(0)) * 100 / 255 }}"
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    # scrolling down never goes below <Minimum brightness>: the step is clamped to the distance above it (0 when at or below it)
                                    brightness_step_pct: >-
                                            {{ iif(scroll_direction == 'right', scroll_clicks * var_dim_step_pct,
                                            -1*([scroll_clicks * var_dim_step_pct, [current_pct - var_min_pct, 0]|max]|min))
                                            }}
                                    transition: "{{ var_light_transition_duration }}"
                              else:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    transition: "{{ var_light_transition_duration }}"
                    # scroll wheel mode: <lights: color temp>
                    - conditions:
                      - condition: template
                        value_template: "{{ repeat.item.startswith('light.') and (scroll_wheel_mode == 'lights: color temp only' or (scroll_wheel_mode == 'lights: color temp and color hue' and state_attr(repeat.item, 'color_temp_kelvin') is not none )) }}"
                      sequence:
                        # scroll wheel mode: lights: color temp
                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            transition: "{{ var_light_transition_duration }}"
                            # step the color temperature and keep it between <Minimum> and <Maximum> color temperature;
                            # a light without a known color temperature starts at the maximum
                            color_temp_kelvin: >-
                              {% set current = state_attr(repeat.item, 'color_temp_kelvin') %}
                              {% if current is none %}
                                {{ var_max_color_temp }}
                              {% else %}
                                {% set new_value = current + iif(scroll_direction == 'left', -1, 1) * var_color_temp_step * scroll_clicks %}
                                {{ [[new_value, var_max_color_temp] | min, var_min_color_temp] | max }}
                              {% endif %}
                      # scroll wheel mode: <lights: color hue>
                    - conditions:
                      - condition: template
                        value_template: "{{ repeat.item.startswith('light.') and (scroll_wheel_mode == 'lights: color hue only' or (scroll_wheel_mode == 'lights: color temp and color hue' and state_attr(repeat.item, 'color_temp_kelvin') is none )) }}"
                      sequence:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            transition: "{{ var_light_transition_duration }}"
                            # step the hue (wraps around at 0/360); a light without a known color starts at hue 0.
                            # saturation is the <Color saturation> setting minus 1 (as in the original helper script), kept within 0..100
                            hs_color: >-
                              {% set current_hue = (state_attr(repeat.item, 'hs_color') or [0, 0])[0] %}
                              {{ [(current_hue + iif(scroll_direction == 'left', -1, 1) * var_color_hue_step * scroll_clicks) % 360,
                                  [[var_color_saturation - 1, 100] | min, 0] | max] }}
                      # scroll wheel mode: <media: volume>
                    - conditions:
                      - condition: template
                        value_template: "{{ repeat.item.startswith('media_player.') and scroll_wheel_mode == 'media: volume control' and (is_state(repeat.item, 'playing') or is_state(repeat.item, 'on') )}}"
                      sequence:
                        - if:
                            - condition: template
                              value_template: "{{ scroll_mode_ext == 'relaxed' or not var_volume_use_up_down_for_instant}}"
                          then:
                            - action: media_player.volume_set
                              target:
                                entity_id: "{{ repeat.item }}"
                              data:
                                volume_level: >- 
                                            {{ [[state_attr(repeat.item, 'volume_level')*100 + 
                                                iif(scroll_direction == 'right', 1, -1)* scroll_clicks * var_volume_step_pct, var_volume_max_pct] | min, 0] | max / 100
                                            }}
                          else:
                            - if:
                                - condition: template
                                  value_template: "{{ scroll_direction == 'left' }}"
                              then:
                                - action: media_player.volume_down
                                  target:
                                    entity_id: "{{ repeat.item }}"
                              else:
                                - if:
                                    - condition: template
                                      value_template: "{{ state_attr(repeat.item, 'volume_level')*100 < var_volume_max_pct }}"
                                  then:
                                    - action: media_player.volume_up
                                      target:
                                        entity_id: "{{ repeat.item }}"


mode: queued
max: !input max_queued_automation_calls
max_exceeded: silent
variables:
  vars: {'targets_entities_ch1': !input scroll_wheel_target_ch1, 'targets_entities_ch2': !input scroll_wheel_target_ch2, 'targets_entities_ch3': !input scroll_wheel_target_ch3, 
  'scroll_wheel_mode_ch1': !input scroll_wheel_mode_ch1, 'scroll_wheel_mode_ch2': !input scroll_wheel_mode_ch2, 'scroll_wheel_mode_ch3': !input scroll_wheel_mode_ch3,
  'scroll_wheel_mode_ext_ch1': !input scroll_wheel_mode_ext_ch1, 'scroll_wheel_mode_ext_ch2': !input scroll_wheel_mode_ext_ch2, 'scroll_wheel_mode_ext_ch3': !input scroll_wheel_mode_ext_ch3,
  'scroll_wheel_mode_dynamic_ch1': !input scroll_wheel_mode_dynamic_ch1, 'scroll_wheel_mode_dynamic_ch2': !input scroll_wheel_mode_dynamic_ch2, 'scroll_wheel_mode_dynamic_ch3': !input scroll_wheel_mode_dynamic_ch3
  }

  var_min_pct: !input dim_min_pct
  var_dim_step_pct: !input dim_step_pct
  var_dim_turns_lights_on: !input dim_turns_lights_on
  var_color_hue_step: !input color_hue_step
  var_color_saturation: !input color_saturation
  var_min_color_temp: !input min_color_temp
  var_max_color_temp: !input max_color_temp
  var_color_temp_step: !input color_temp_step
  var_light_transition_duration: !input light_transition_duration
  var_on_hold_delay: !input on_hold_delay
  var_volume_step_pct: !input volume_step_pct
  var_volume_max_pct: !input volume_max_pct
  var_volume_use_up_down_for_instant: !input volume_use_up_down_for_instant
  var_reset_time_input_select_helpers: !input auto_reset_time_input_select_helpers

  last_triggered_seconds: >
    {{ as_timestamp(now()) - as_timestamp(this.attributes.last_triggered, 0) }}   


trigger_variables:
  var_remote: !input remote

  # entity ids of the remote, found from the device only: the button number is the last part of the entity id
  # (optionally followed by the _<number> suffix HA adds for duplicate ids); empty when not found

  var_button_ch1: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_3(?:_\d+)?$') | first | default('') }}
  var_scroll_left_ch1: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_2(?:_\d+)?$') | first | default('') }}
  var_scroll_right_ch1: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_1(?:_\d+)?$') | first | default('') }}
  var_scroll_left_ext_ch1: >-
    {{ device_entities(var_remote) | select('match', '^sensor\..+[a-zA-Z]_2(?:_\d+)?$') | first | default('') }}
  var_scroll_right_ext_ch1: >-
    {{ device_entities(var_remote) | select('match', '^sensor\..+[a-zA-Z]_1(?:_\d+)?$') | first | default('') }}

  var_button_ch2: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_6(?:_\d+)?$') | first | default('') }}
  var_scroll_left_ch2: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_5(?:_\d+)?$') | first | default('') }}
  var_scroll_right_ch2: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_4(?:_\d+)?$') | first | default('') }}
  var_scroll_left_ext_ch2: >-
    {{ device_entities(var_remote) | select('match', '^sensor\..+[a-zA-Z]_5(?:_\d+)?$') | first | default('') }}
  var_scroll_right_ext_ch2: >-
    {{ device_entities(var_remote) | select('match', '^sensor\..+[a-zA-Z]_4(?:_\d+)?$') | first | default('') }}

  var_button_ch3: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_9(?:_\d+)?$') | first | default('') }}
  var_scroll_left_ch3: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_8(?:_\d+)?$') | first | default('') }}
  var_scroll_right_ch3: >-
    {{ device_entities(var_remote) | select('match', '^event\..+[a-zA-Z]_7(?:_\d+)?$') | first | default('') }}
  var_scroll_left_ext_ch3: >-
    {{ device_entities(var_remote) | select('match', '^sensor\..+[a-zA-Z]_8(?:_\d+)?$') | first | default('') }}
  var_scroll_right_ext_ch3: >-
    {{ device_entities(var_remote) | select('match', '^sensor\..+[a-zA-Z]_7(?:_\d+)?$') | first | default('') }}
